<script>
'use strict';
/* ============ álgebra ============ */
function V(x, y, z) { return { x, y, z }; }
function add(a, b) { return V(a.x + b.x, a.y + b.y, a.z + b.z); }
function sub(a, b) { return V(a.x - b.x, a.y - b.y, a.z - b.z); }
function mul(a, k) { return V(a.x * k, a.y * k, a.z * k); }
function cross(a, b) { return V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x); }
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function norm(a) { const l = Math.hypot(a.x, a.y, a.z) || 1; return V(a.x / l, a.y / l, a.z / l); }
function rotX(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x, v.y * c - v.z * s, v.y * s + v.z * c); }
function rotY(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x * c + v.z * s, v.y, -v.x * s + v.z * c); }
function rotZ(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x * c - v.y * s, v.x * s + v.y * c, v.z); }
function xf(v, r) { return rotY(rotX(rotZ(v, r.z), r.x), r.y); }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function smooth(a, b, x) { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
function mix(c1, c2, t) { return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t]; }
function C(r, g, b) { return [r * 255, g * 255, b * 255]; }
function lighten(c, k) { return mix(c, [255, 255, 255], k); }
function darken(c, k) { return mix(c, [0, 0, 0], k); }
function lcg(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ============ malha: {verts:[{p,n,c}], tris:[[a,b,c]]} ============ */

/* Catmull-Rom sobre seções {p, rx, ry} */
function resample(sections, per) {
  const out = [];
  const n = sections.length;
  const get = i => sections[Math.max(0, Math.min(n - 1, i))];
  const cr = (a, b, c, d, t) => b + 0.5 * t * (c - a + t * (2 * a - 5 * b + 4 * c - d + t * (3 * (b - c) + d - a)));
  for (let i = 0; i < n - 1; i++) {
    const s0 = get(i - 1), s1 = get(i), s2 = get(i + 1), s3 = get(i + 2);
    const steps = i === n - 2 ? per + 1 : per;
    for (let k = 0; k < steps; k++) {
      const t = k / per;
      out.push({
        p: V(cr(s0.p.x, s1.p.x, s2.p.x, s3.p.x, t), cr(s0.p.y, s1.p.y, s2.p.y, s3.p.y, t), cr(s0.p.z, s1.p.z, s2.p.z, s3.p.z, t)),
        rx: Math.max(0.004, cr(s0.rx, s1.rx, s2.rx, s3.rx, t)),
        ry: Math.max(0.004, cr(s0.ry ?? s0.rx, s1.ry ?? s1.rx, s2.ry ?? s2.rx, s3.ry ?? s3.rx, t)),
      });
    }
  }
  return out;
}

/* Loft: gera tubo suave fechado ao longo das seções.
   colorFn(u, sinT, cosT) -> [r,g,b]; u = 0..1 ao longo da espinha. */
function loft(sections, segs, colorFn, baseColor) {
  const S = resample(sections, 4);
  const verts = [], tris = [];
  const rows = [];
  for (let i = 0; i < S.length; i++) {
    const prev = S[Math.max(0, i - 1)].p, next = S[Math.min(S.length - 1, i + 1)].p;
    let t = norm(sub(next, prev));
    let up0 = Math.abs(t.y) > 0.9 ? V(0, 0, 1) : V(0, 1, 0);
    const right = norm(cross(up0, t));
    const upv = norm(cross(t, right));
    const u = i / (S.length - 1);
    const row = [];
    for (let j = 0; j < segs; j++) {
      const th = 2 * Math.PI * j / segs;
      const ct = Math.cos(th), st = Math.sin(th);
      const p = add(S[i].p, add(mul(right, ct * S[i].rx), mul(upv, st * S[i].ry)));
      const c = colorFn ? colorFn(u, st, ct) : baseColor;
      row.push(verts.push({ p, n: V(0, 0, 0), c }) - 1);
    }
    rows.push(row);
  }
  for (let i = 0; i < rows.length - 1; i++) {
    for (let j = 0; j < segs; j++) {
      const a = rows[i][j], b = rows[i + 1][j], c = rows[i + 1][(j + 1) % segs], d = rows[i][(j + 1) % segs];
      tris.push([a, b, d]); tris.push([b, c, d]);
    }
  }
  return { verts, tris };
}

/* esfera suave para detalhes (olhos, nariz) */
function ball(r, pos, color, scale, seg) {
  seg = seg || 10;
  scale = scale || V(1, 1, 1);
  const verts = [], tris = [], rows = [];
  const rings = Math.max(6, seg - 2);
  for (let i = 0; i <= rings; i++) {
    const ph = Math.PI * i / rings, row = [];
    for (let j = 0; j < seg; j++) {
      const th = 2 * Math.PI * j / seg;
      const p = V(r * Math.sin(ph) * Math.cos(th) * scale.x, r * Math.cos(ph) * scale.y, r * Math.sin(ph) * Math.sin(th) * scale.z);
      row.push(verts.push({ p: add(p, pos), n: V(0, 0, 0), c: color }) - 1);
    }
    rows.push(row);
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < seg; j++) {
    const a = rows[i][j], b = rows[i + 1][j], c = rows[i + 1][(j + 1) % seg], d = rows[i][(j + 1) % seg];
    if (i > 0) tris.push([a, b, d]);
    if (i < rings - 1) tris.push([b, c, d]);
  }
  return { verts, tris };
}

/* caixinha (bigodes, língua) — normais duras, ok para detalhes finos */
function slab(sx, sy, sz, pos, rot, color) {
  const x = sx / 2, y = sy / 2, z = sz / 2;
  const P = [V(-x,-y,-z),V(x,-y,-z),V(x,y,-z),V(-x,y,-z),V(-x,-y,z),V(x,-y,z),V(x,y,z),V(-x,y,z)];
  const F = [[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]];
  const verts = [], tris = [];
  for (const q of F) {
    const idx = q.map(k => {
      let p = P[k];
      if (rot) p = xf(p, rot);
      return verts.push({ p: add(p, pos), n: V(0, 0, 0), c: color }) - 1;
    });
    tris.push([idx[0], idx[1], idx[2]]); tris.push([idx[0], idx[2], idx[3]]);
  }
  return { verts, tris };
}

function computeNormals(mesh) {
  for (const t of mesh.tris) {
    const a = mesh.verts[t[0]].p, b = mesh.verts[t[1]].p, c = mesh.verts[t[2]].p;
    const n = cross(sub(b, a), sub(c, a));
    for (const i of t) { const vn = mesh.verts[i].n; vn.x += n.x; vn.y += n.y; vn.z += n.z; }
  }
  for (const v of mesh.verts) v.n = norm(v.n);
  return mesh;
}

/* ============ construção dos pets ============ */
/* Grupos animáveis: core (corpo), head, tail, legs[4], ball. As peças de
   cada grupo giram em torno da origem do grupo (espelha o pet_body.gd). */

function Group(origin, parentGroup) { return { origin, rot: V(0, 0, 0), off: V(0, 0, 0), meshes: [], parentGroup: parentGroup || null }; }
function put(group, mesh, tag) { computeNormals(mesh); mesh.tag = tag || null; group.meshes.push(mesh); }

const PETS = {
  sirius: {
    name: 'Sirius', tag: 'Latido Potente — protetor e estabanado',
    scale: 1.12, defense: 'bark', cute: 'sit_wag', tongue: true, flopK: 0.35,
    body: C(0.16, 0.15, 0.16), grizzle: C(0.63, 0.61, 0.58),
    eye: C(0.72, 0.42, 0.12), eyeR: 0.045,
    headOrigin: V(0, 0.86, 0.38),
    build(g) {
      const B = this.body;
      g.tail.origin = V(0, 0.6, -0.36);
      // corpo atlético: peito fundo, cintura marcada, pescoço subindo
      const bodyFn = (u, st) => {
        let c = B;
        c = mix(c, lighten(B, 0.08), smooth(0.1, 0.7, -st) * 0.4);
        return mix(c, lighten(B, 0.12), smooth(0.55, 0.85, u) * 0.4);
      };
      put(g.core, loft([
        { p: V(0, 0.62, -0.38), rx: 0.05 },
        { p: V(0, 0.62, -0.28), rx: 0.16, ry: 0.17 },
        { p: V(0, 0.60, -0.05), rx: 0.145, ry: 0.155 },
        { p: V(0, 0.60, 0.15), rx: 0.165, ry: 0.205 },
        { p: V(0, 0.72, 0.30), rx: 0.125, ry: 0.125 },
        { p: V(0, 0.80, 0.36), rx: 0.045 },
      ], 12, bodyFn));
      // cabeça de pastor: crânio + focinho longo com máscara grisalha
      const H = this.headOrigin;
      const headFn = (u, st) => {
        const griz = smooth(0.58, 0.78, u) * smooth(0.0, -0.6, st) * 0.85 + smooth(0.82, 0.97, u) * 0.5;
        return mix(B, this.grizzle, Math.min(1, griz));
      };
      put(g.head, loft([
        { p: add(H, V(0, 0.0, -0.14)), rx: 0.05 },
        { p: add(H, V(0, 0.03, -0.03)), rx: 0.135, ry: 0.125 },
        { p: add(H, V(0, 0.0, 0.06)), rx: 0.12, ry: 0.11 },
        { p: add(H, V(0, -0.05, 0.14)), rx: 0.062, ry: 0.055 },
        { p: add(H, V(0, -0.055, 0.21)), rx: 0.048, ry: 0.042 },
        { p: add(H, V(0, -0.055, 0.235)), rx: 0.016 },
      ], 10, headFn));
      // orelhas semi-eretas com ponta dobrada
      for (const s of [-1, 1]) {
        const ear = s < 0 ? g.earL : g.earR;
        ear.origin = add(H, V(0.07 * s, 0.1, -0.02));
        put(ear, loft([
          { p: add(H, V(0.075 * s, 0.1, -0.02)), rx: 0.055, ry: 0.022 },
          { p: add(H, V(0.105 * s, 0.2, -0.03)), rx: 0.042, ry: 0.017 },
          { p: add(H, V(0.13 * s, 0.225, -0.02)), rx: 0.028, ry: 0.013 },
          { p: add(H, V(0.155 * s, 0.19, 0.01)), rx: 0.007 },
        ], 7, null, darken(B, 0.06)));
      }
      legSet(g, 0.13, 0.22, 0.58, 0.055, B, lighten(B, 0.06), 0.4);
      // cauda-sabre emplumada (para trás, levemente erguida)
      put(g.tail, loft([
        { p: V(0, 0.58, -0.42), rx: 0.045 },
        { p: V(0, 0.5, -0.56), rx: 0.06, ry: 0.055 },
        { p: V(0, 0.48, -0.7), rx: 0.05, ry: 0.045 },
        { p: V(0, 0.55, -0.82), rx: 0.028 },
        { p: V(0, 0.6, -0.86), rx: 0.006 },
      ], 8, u => mix(this.body, lighten(this.body, 0.15), u * 0.7)));
      // LASCAS DE PELO (shaggy): colar, peito, culotes, dorso e pluma
      const fur = lcg(777);
      const shades = [B, lighten(B, 0.09), lighten(B, 0.16), darken(B, 0.08)];
      const pick = () => shades[(fur() * shades.length) | 0];
      // colar do pescoço (anel de lascas apontando para baixo/fora)
      for (let i = 0; i < 9; i++) {
        const a = -Math.PI * 0.15 + (i / 8) * Math.PI * 1.3;
        const bx = Math.cos(a) * 0.15, by = 0.66 - Math.sin(Math.max(0, Math.sin(a))) * 0.02;
        shard(g.core, V(bx, by, 0.24 - Math.abs(Math.sin(a)) * 0.03),
          norm(V(Math.cos(a) * 0.4, -0.8, 0.25 + fur() * 0.15)), 0.11 + fur() * 0.03, 0.052, pick());
      }
      // franja do peito
      for (let i = 0; i < 3; i++) {
        shard(g.core, V(-0.05 + i * 0.05, 0.52, 0.29), norm(V(0, -1, 0.2)), 0.1, 0.045, pick());
      }
      // culotes (coxas traseiras)
      for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
        shard(g.core, V(0.13 * s, 0.5 - i * 0.05, -0.24 - i * 0.02),
          norm(V(0.12 * s, -0.65, -0.7)), 0.1, 0.045, pick());
      }
      // pelo escorrendo no dorso
      for (let i = 0; i < 4; i++) {
        shard(g.core, V((fur() - 0.5) * 0.14, 0.75 - i * 0.015, 0.05 - i * 0.11),
          norm(V(0, -0.2, -1)), 0.09, 0.045, pick());
      }
      // pluma da cauda
      for (let i = 0; i < 5; i++) {
        shard(g.tail, V(0, 0.52 - i * 0.008, -0.5 - i * 0.07),
          norm(V(0, -0.8, -0.4)), 0.1 - i * 0.008, 0.04, pick());
      }
      face(g, this, V(0.058, 0.04, 0.115), V(0, -0.052, 0.235), 0.028, C(0.06, 0.05, 0.05));
      tongueOf(g, this, add(H, V(0, -0.1, 0.17)), false);
    },
  },

  belatriz: {
    name: 'Belatriz', tag: 'Modo Feroz — pequena e valente',
    scale: 0.78, defense: 'ferocious', cute: 'belly_up', blep: true, flopK: 0.6,
    body: C(0.88, 0.81, 0.66), cream: C(0.95, 0.91, 0.8),
    eye: C(0.22, 0.15, 0.1), eyeR: 0.06,
    headOrigin: V(0, 0.56, 0.26),
    build(g) {
      const B = this.body, CRE = this.cream;
      g.tail.origin = V(0, 0.35, -0.22);
      // filhote compacto e fofinho
      const bodyFn = (u, st) => mix(B, CRE, smooth(0.0, 0.6, -st) * 0.7 + smooth(0.6, 0.9, u) * 0.3);
      put(g.core, loft([
        { p: V(0, 0.33, -0.24), rx: 0.05 },
        { p: V(0, 0.33, -0.16), rx: 0.155, ry: 0.15 },
        { p: V(0, 0.32, 0.0), rx: 0.165, ry: 0.16 },
        { p: V(0, 0.34, 0.12), rx: 0.15, ry: 0.147 },
        { p: V(0, 0.42, 0.2), rx: 0.11 },
        { p: V(0, 0.46, 0.24), rx: 0.04 },
      ], 12, bodyFn));
      // CABEÇÃO fofo com focinho curtinho
      const H = this.headOrigin;
      const headFn = (u, st) => {
        let c = mix(B, CRE, smooth(0.5, 0.8, u) * 0.7);
        return mix(c, lighten(B, 0.1), smooth(0.5, 0.2, u) * smooth(0.3, 0.9, st) * 0.5);
      };
      put(g.head, loft([
        { p: add(H, V(0, 0.02, -0.11)), rx: 0.05 },
        { p: add(H, V(0, 0.03, -0.02)), rx: 0.155, ry: 0.145 },
        { p: add(H, V(0, 0.01, 0.07)), rx: 0.145, ry: 0.135 },
        { p: add(H, V(0, -0.05, 0.13)), rx: 0.075, ry: 0.058 },
        { p: add(H, V(0, -0.055, 0.155)), rx: 0.02 },
      ], 10, headFn));
      // orelhas semi-eretas com ponta dobrada e rosinha interna
      for (const s of [-1, 1]) {
        const ear = s < 0 ? g.earL : g.earR;
        ear.origin = add(H, V(0.09 * s, 0.11, -0.01));
        put(ear, loft([
          { p: add(H, V(0.09 * s, 0.11, -0.01)), rx: 0.05, ry: 0.02 },
          { p: add(H, V(0.13 * s, 0.19, -0.02)), rx: 0.04, ry: 0.016 },
          { p: add(H, V(0.165 * s, 0.17, 0.02)), rx: 0.025, ry: 0.012 },
          { p: add(H, V(0.175 * s, 0.13, 0.045)), rx: 0.006 },
        ], 7, u => mix(darken(this.body, 0.1), C(0.9, 0.6, 0.62), smooth(0.3, 0.7, u) * 0.45)));
      }
      legSet(g, 0.115, 0.15, 0.30, 0.055, B, CRE, 0.5);
      // rabinho curto curvado para cima
      put(g.tail, loft([
        { p: V(0, 0.35, -0.26), rx: 0.035 },
        { p: V(0, 0.45, -0.3), rx: 0.045, ry: 0.04 },
        { p: V(0, 0.55, -0.26), rx: 0.03 },
        { p: V(0, 0.6, -0.2), rx: 0.007 },
      ], 7, u => mix(this.body, this.cream, u * 0.6)));
      face(g, this, V(0.062, 0.03, 0.115), V(0, -0.04, 0.16), 0.028, C(0.06, 0.05, 0.05));
      // sobrancelhas expressivas (pontinhos da folha de design)
      for (const s of [-1, 1]) {
        put(g.head, ball(0.022, add(H, V(0.062 * s, 0.105, 0.11)), C(0.5, 0.42, 0.3), V(1.3, 0.7, 0.6), 6));
      }
      tongueOf(g, this, add(H, V(0, -0.09, 0.13)), true);
    },
  },

  zoe: {
    name: 'Zoe', tag: 'Escalada Fantasma — bagunceira invisível',
    scale: 1.0, defense: 'hide', cute: 'play', flopK: 0.35,
    body: C(0.63, 0.45, 0.3), stripe: C(0.33, 0.23, 0.16), white: C(0.95, 0.93, 0.88),
    eye: C(0.55, 0.75, 0.35), eyeR: 0.045,
    headOrigin: V(0, 0.7, 0.29),
    build(g) {
      const B = this.body, ST = this.stripe, W = this.white;
      g.tail.origin = V(0, 0.46, -0.26);
      // tabby: listras no dorso + peito/barriga brancos
      const tabby = (u, st) => {
        let c = B;
        const band = Math.pow(Math.abs(Math.sin(u * 22)), 6) * smooth(-0.25, 0.25, st);
        c = mix(c, ST, band * 0.85);
        c = mix(c, W, smooth(-0.15, -0.65, st) * 0.9);          // barriga branca
        return mix(c, W, smooth(0.62, 0.88, u) * smooth(0.15, -0.4, st)); // peito branco
      };
      put(g.core, loft([
        { p: V(0, 0.46, -0.3), rx: 0.05 },
        { p: V(0, 0.46, -0.22), rx: 0.14, ry: 0.145 },
        { p: V(0, 0.45, -0.03), rx: 0.135, ry: 0.15 },
        { p: V(0, 0.46, 0.12), rx: 0.14, ry: 0.15 },
        { p: V(0, 0.56, 0.22), rx: 0.09 },
        { p: V(0, 0.62, 0.27), rx: 0.04 },
      ], 12, tabby));
      // cabeça de gata: testa listrada + focinho branco + nariz rosa
      const H = this.headOrigin;
      const headFn = (u, st, ct) => {

        c = mix(c, ST, fore * 0.8);
        return mix(c, W, smooth(0.6, 0.82, u) * smooth(0.1, -0.5, st) * 0.95 + smooth(0.78, 0.95, u) * 0.5);
      };
      put(g.head, loft([
        { p: add(H, V(0, 0.01, -0.1)), rx: 0.04 },
        { p: add(H, V(0, 0.02, -0.02)), rx: 0.12, ry: 0.105 },
        { p: add(H, V(0, -0.01, 0.05)), rx: 0.11, ry: 0.1 },
        { p: add(H, V(0, -0.04, 0.115)), rx: 0.052, ry: 0.042 },
        { p: add(H, V(0, -0.04, 0.14)), rx: 0.016 },
      ], 10, headFn));
      catEars(g, H, B, 1.0, C(0.85, 0.55, 0.5));
      legSet(g, 0.105, 0.16, 0.40, 0.048, B, W, 0.9);
      // cauda erguida com aneizinhos
      put(g.tail, loft([
        { p: V(0, 0.46, -0.3), rx: 0.038 },
        { p: V(0, 0.6, -0.36), rx: 0.032 },
        { p: V(0, 0.78, -0.34), rx: 0.028 },
        { p: V(0, 0.92, -0.27), rx: 0.022 },
        { p: V(0, 0.99, -0.22), rx: 0.006 },
      ], 7, u => mix(this.body, this.stripe, Math.pow(Math.abs(Math.sin(u * 14)), 6) * 0.85)));
      face(g, this, V(0.05, 0.025, 0.095), V(0, -0.028, 0.145), 0.02, C(0.85, 0.5, 0.5));
    },
  },

  minerva: {
    name: 'Minerva', tag: 'Patada Potente — rápida e implacável',

    headOrigin: V(0, 0.76, 0.32),
    build(g) {

      // gata elegante: peito fundo, cintura, pescoço alto

      ], 10, (u, st) => mix(B, SH, smooth(0.2, 1, st) * 0.4)));
      catEars(g, H, B, 1.25, darken(B, 0.25));

      put(g.tail, loft([

      // bigodes brancos

        put(g.head, slab(0.15, 0.005, 0.005, add(H, V(0.11 * s, -0.025 - 0.026 * i, 0.1)), V(0, 0.42 * s, 0.1 * s * (i ? -0.5 : 1)), C(0.93, 0.93, 0.9)));
      }

/* lasca de pelo: pétala achatada e angular (estilo shaggy da referência) */
function shard(group, base, dir, len, w, color) {
  put(group, loft([
    { p: base, rx: w, ry: w * 0.5 },
    { p: add(base, mul(dir, len * 0.5)), rx: w * 0.85, ry: w * 0.4 },
    { p: add(base, mul(dir, len)), rx: 0.005 },
  ], 5, null, color));
}

/* pernas retas com patinha definida; pawMix controla a "meia" branca */
function legSet(g, x, z, hipY, r, color, pawTone, pawMix) {
  const zs = [z, z, -z, -z];
  for (let i = 0; i < 4; i++) {
    const lx = (i % 2 === 0 ? -1 : 1) * x;
    const lz = zs[i];
    const leg = g.legs[i];
    leg.origin = V(lx, hipY, lz);
    put(leg, loft([
      { p: V(lx, hipY + 0.05, lz), rx: r * 1.35 },
      { p: V(lx, hipY * 0.55, lz), rx: r },
      { p: V(lx, 0.085, lz), rx: r * 0.88 },
      { p: V(lx, 0.045, lz + 0.02), rx: r * 1.18, ry: r * 0.82 },
      { p: V(lx, 0.008, lz + 0.028), rx: r * 0.5 },
    ], 8, u => mix(color, pawTone, smooth(0.68, 0.88, u) * pawMix)));
  }
}

/* orelhas de gato: triângulos achatados grandes */
function catEars(g, H, color, k, innerColor) {
  for (const s of [-1, 1]) {
    const ear = s < 0 ? g.earL : g.earR;
    ear.origin = add(H, V(0.065 * s, 0.07, -0.02));
    put(ear, loft([
      { p: add(H, V(0.065 * s, 0.07, -0.02)), rx: 0.052 * k, ry: 0.018 },
      { p: add(H, V(0.09 * s, 0.07 + 0.11 * k, -0.03)), rx: 0.032 * k, ry: 0.013 },
      { p: add(H, V(0.108 * s, 0.07 + 0.17 * k, -0.04)), rx: 0.005 },
    ], 6, u => mix(color, innerColor, (1 - u) * 0.3)));
  }
}

/* olhos com íris grande + nariz (cor por pet: preto ou rosa) */
function face(g, pet, eyeAt, noseAt, noseR, noseColor) {
  const H = pet.headOrigin;
  for (const s of [-1, 1]) {
    const e = add(H, V(eyeAt.x * s, eyeAt.y, eyeAt.z));
    const out = norm(V(0.28 * s, 0.12, 0.95));
    const at = k2 => add(e, mul(out, pet.eyeR * k2));
    put(g.head, ball(pet.eyeR, e, C(0.93, 0.91, 0.88), V(1, 1, 0.5), 9));
    put(g.head, ball(pet.eyeR * 0.88, at(0.22), pet.eye, V(1, 1, 0.5), 9));
    put(g.head, ball(pet.eyeR * 0.5, at(0.45), C(0.05, 0.05, 0.05), V(1, 1, 0.5), 7));
    put(g.head, ball(pet.eyeR * 0.16, add(at(0.6), V(pet.eyeR * 0.18 * s, pet.eyeR * 0.22, 0)), [255, 255, 255], V(1, 1, 1), 5));
  }
  put(g.head, ball(noseR, add(H, noseAt), noseColor, V(1.3, 0.8, 0.85), 7));
}

function tongueOf(g, pet, at, always) {
  const m = loft([
    { p: at, rx: 0.026, ry: 0.01 },
    { p: add(at, V(0, -0.032, 0.018)), rx: 0.024, ry: 0.009 },
    { p: add(at, V(0, -0.05, 0.02)), rx: 0.011, ry: 0.006 },
  ], 7, null, C(0.93, 0.5, 0.55));
  put(g.head, m, always ? null : 'tongue');
}

function buildPet(id) {
  const def = PETS[id];
  const head = Group(def.headOrigin);
  const g = {
    core: Group(V(0, 0, 0)),
    head,
    earL: Group(V(0, 0, 0), head),
    earR: Group(V(0, 0, 0), head),
    tail: Group(V(0, 0, 0)),
    legs: [Group(V(0, 0, 0)), Group(V(0, 0, 0)), Group(V(0, 0, 0)), Group(V(0, 0, 0))],
    ballGroup: Group(V(0, 0, 0)),
  };
  def.build(g);
  // bolinha da pose "play"
  put(g.ballGroup, ball(0.09, V(0, 0.09, 0.55), C(0.9, 0.25, 0.3), V(1, 1, 1), 9));
  put(g.ballGroup, ball(0.092, V(0, 0.09, 0.55), C(0.95, 0.9, 0.85), V(1, 0.22, 1), 9));
  return { id, def, g, pose: 'idle', alpha: 1 };
}

/* ============ poses ============ */
/* Marcha quadrúpede diagonal + squash & stretch + movimento secundário
   (orelhas e rabo com atraso). Mesmas fórmulas vão para pet_body.gd. */
const GAIT_PHASE = [0, Math.PI, Math.PI, 0]; // FL, FR, BL, BR — pares diagonais

function applyPose(pet, t) {
  const g = pet.g;
  const cr = V(0, 0, 0), cp = V(0, 0, 0);
  let cs = V(1, 1, 1);
  let wag = 3, wagAmp = 0.55, headRx = 0, headRz = 0, showBall = false, alpha = 1, bounce = 0;
  const legRot = [0, 0, 0, 0], legLift = [0, 0, 0, 0];
  let earSwing = 0;
  switch (pet.pose) {
    case 'walk': {
      const ph = t * 9;
      for (let i = 0; i < 4; i++) {
        legRot[i] = Math.sin(ph + GAIT_PHASE[i]) * 0.55;
        legLift[i] = Math.max(0, Math.sin(ph + GAIT_PHASE[i] + Math.PI / 2)) * 0.05;
      }
      cp.y = Math.abs(Math.sin(ph)) * 0.03;
      cr.z = Math.sin(ph) * 0.03;
      const sq = 1 + Math.sin(ph * 2 + Math.PI / 2) * 0.03;
      cs = V(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
      headRx = Math.sin(ph * 2) * 0.05;
      earSwing = Math.sin(ph * 2 - 0.9) * 0.2;
      wag = 7; break;
    }
    case 'idle': {
      const breathe = 1 + Math.sin(t * 2) * 0.012;
      cs = V(1, breathe, 1);
      cp.y = Math.sin(t * 2) * 0.006;
      headRz = Math.sin(t * 0.6) * 0.05;
      earSwing = Math.sin(t * 1.3) * 0.05;
      wag = 2.2; wagAmp = 0.3; break;
    }
    case 'bark':
      cr.x = -0.22; headRx = Math.sin(t * 20) * 0.18;
      earSwing = Math.sin(t * 20 - 1) * 0.3;
      cs = V(1.02, 0.97, 1.02); wag = 10; break;
    case 'ferocious':
      cr.x = 0.18; cp.y = Math.abs(Math.sin(t * 14)) * 0.05;
      cs = V(1.04, 1 + Math.sin(t * 14) * 0.03, 1.04);
      earSwing = -0.25; wag = 14; break;
    case 'pounce':
      cr.x = 0.32; cs = V(0.94, 0.94, 1.14); earSwing = -0.3; wag = 8; break;
    case 'hide':
      cp.y = -0.1; cr.x = 0.08; cs = V(1.05, 0.84, 1.05);
      earSwing = -0.25; alpha = 0.35; break;
    case 'sit_wag':
      cr.x = -0.45; cp.y = -0.04; wag = 16;
      earSwing = Math.sin(t * 16) * 0.07;
      headRz = Math.sin(t * 3) * 0.06; break;
    case 'belly_up':
      cr.z = Math.PI; cp.y = 0.86; earSwing = 0.18;
      for (let i = 0; i < 4; i++) legRot[i] = Math.sin(t * 6 + i) * 0.3;
      break;
    case 'play':
      cr.x = 0.26; cp.y = Math.abs(Math.sin(t * 8)) * 0.07;
      cs = V(1, 1 + Math.sin(t * 8) * 0.05, 1);
      earSwing = Math.sin(t * 8) * 0.15;
      wag = 12; showBall = true; bounce = Math.abs(Math.sin(t * 8 + 1)) * 0.24; break;
    case 'rub':
      cr.z = Math.sin(t * 5) * 0.32; earSwing = Math.sin(t * 5) * 0.12; wag = 10; break;
  }
  g.core.rot = cr; g.core.off = cp;
  pet.coreScale = cs;
  g.head.rot = V(headRx, 0, headRz);
  // rabo com follow-through: onda principal + camada atrasada
  g.tail.rot = V(0, Math.sin(t * wag) * wagAmp + Math.sin(t * wag * 0.5 - 0.6) * wagAmp * 0.35, 0);
  g.legs.forEach((l, i) => { l.rot = V(legRot[i], 0, 0); l.off = V(0, legLift[i], 0); });
  // orelhas com flop atrasado; caídas (cães) balançam mais que as de gato
  const eAmp = pet.def.flopK || 0.35;
  g.earL.rot = V(earSwing * eAmp, 0, -Math.abs(earSwing) * 0.4 * eAmp);
  g.earR.rot = V(earSwing * eAmp, 0, Math.abs(earSwing) * 0.4 * eAmp);
  pet.showBall = showBall; pet.bounce = bounce; pet.alpha = alpha;
  pet.tongueOut = !!pet.def.tongue && (pet.pose === 'walk' || pet.pose === 'sit_wag' || pet.pose === 'play');
}

/* ============ render ============ */
const KEY = norm(V(-0.45, 0.9, 0.6));
const FILL = norm(V(0.6, 0.25, -0.4));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeViewer(canvas, pet) {
  const ctx = canvas.getContext('2d');
  let yaw = 0.55, pitch = 0.2, dragging = false, lx = 0, ly = 0, spin = !REDUCED;

  const stage = canvas.parentElement;
  stage.addEventListener('pointerdown', e => { dragging = true; spin = false; lx = e.clientX; ly = e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw += (e.clientX - lx) * 0.011;
    pitch = Math.max(-0.15, Math.min(0.75, pitch + (e.clientY - ly) * 0.008));
    lx = e.clientX; ly = e.clientY;
  });
  stage.addEventListener('pointerup', () => { dragging = false; });
  stage.addEventListener('pointercancel', () => { dragging = false; });

  function drawGroup(group, out, k, opts) {
    const core = pet.g.core;
    const cs = pet.coreScale || V(1, 1, 1);
    for (const mesh of group.meshes) {
      if (mesh.tag === 'tongue' && !pet.tongueOut) continue;
      // transforma: grupo -> pai (orelha->cabeça) -> core -> squash&stretch
      const tv = mesh.verts.map(v => {
        let p = v.p, n = v.n;
        let gr = group;
        while (gr) {
          p = add(add(xf(sub(p, gr.origin), gr.rot), gr.origin), gr.off);
          n = xf(n, gr.rot);
          gr = gr.parentGroup;
        }
        if (!opts || !opts.skipCore) {
          if (group !== core) {
            p = add(xf(p, core.rot), core.off);
            n = xf(n, core.rot);
          }
          p = V(p.x * cs.x, p.y * cs.y, p.z * cs.z);
        }
        if (opts && opts.extra) p = add(p, opts.extra);
        p = mul(p, k);
        p = rotX(rotY(p, yaw), pitch);
        n = rotX(rotY(n, yaw), pitch);
        return { p, n, c: v.c };
      });
      for (const t of mesh.tris) out.push([tv[t[0]], tv[t[1]], tv[t[2]]]);
    }
  }

  function frame(ms) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (canvas.width !== cw * dpr) { canvas.width = cw * dpr; canvas.height = ch * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (spin) yaw += 0.0035;
    applyPose(pet, ms / 1000);

    // sombra
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--shadow');
    ctx.beginPath();
    ctx.ellipse(cw / 2, ch * 0.87, 64 * pet.def.scale, 13 * pet.def.scale, 0, 0, Math.PI * 2);
    ctx.fill();

    const tris = [];
    const k = pet.def.scale;
    for (const grp of [pet.g.core, pet.g.head, pet.g.earL, pet.g.earR, pet.g.tail, ...pet.g.legs]) drawGroup(grp, tris, k);
    if (pet.showBall) drawGroup(pet.g.ballGroup, tris, k, { skipCore: true, extra: V(0, pet.bounce, 0) });

    // projeção
    const S = Math.min(cw, ch * 1.45);
    const camY = 0.6 * k, camZ = 3.1, f = 1.08;
    const drawn = [];
    for (const tv of tris) {
      const pv = tv.map(v => {
        const z = camZ - v.p.z;
        return { x: cw / 2 + (v.p.x * f / z) * S, y: ch * 0.87 - ((v.p.y - camY) * f / z + camY * f / camZ) * S, z };
      });
      // shading FACETADO: normal da face (estilo low-poly das referências)
      let fn = norm(cross(sub(tv[1].p, tv[0].p), sub(tv[2].p, tv[0].p)));
      if (fn.z < 0) fn = V(-fn.x, -fn.y, -fn.z);
      const it = 0.42 + 0.5 * Math.max(0, dot(fn, KEY)) + 0.18 * Math.max(0, dot(fn, FILL));
      let cr2 = 0, cg = 0, cb = 0;
      for (const v of tv) { cr2 += v.c[0]; cg += v.c[1]; cb += v.c[2]; }
      cr2 /= 3; cg /= 3; cb /= 3;
      drawn.push({ pv, depth: (pv[0].z + pv[1].z + pv[2].z) / 3, col: `rgb(${Math.min(255, cr2 * it) | 0},${Math.min(255, cg * it) | 0},${Math.min(255, cb * it) | 0})` });
    }
    drawn.sort((a, b) => b.depth - a.depth);
    ctx.globalAlpha = pet.alpha;
    for (const t of drawn) {
      ctx.fillStyle = t.col; ctx.strokeStyle = t.col; ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(t.pv[0].x, t.pv[0].y); ctx.lineTo(t.pv[1].x, t.pv[1].y); ctx.lineTo(t.pv[2].x, t.pv[2].y);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

    b.type = 'button';
    b.textContent = POSE_LABELS[key];
    b.setAttribute('aria-pressed', key === 'idle' ? 'true' : 'false');
    b.addEventListener('click', () => {
      pet.pose = key === 'defense' ? def.defense : key === 'cute' ? def.cute : key;
      for (const kk in buttons) buttons[kk].setAttribute('aria-pressed', kk === key ? 'true' : 'false');
    });
    buttons[key] = b;
    posesEl.appendChild(b);
  }
  makeViewer(card.querySelector('canvas'), pet);
}
</script>
