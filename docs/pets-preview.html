<div class="wrap">
  <header>
    <div class="eyebrow">Caos em Casa</div>
    <h1>Preview 3D dos Pets</h1>
    <p>Versão 2 — malhas contínuas esculpidas, estilo brinquedo fofinho. Arraste para girar, escolha uma pose.</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Corpos gerados por loft (seções ao longo da espinha) com normais suaves e cores pintadas por vértice — mesma técnica que vai para o jogo.</footer>

<script>
'use strict';
/* ============ álgebra ============ */
function V(x, y, z) { return { x, y, z }; }
function add(a, b) { return V(a.x + b.x, a.y + b.y, a.z + b.z); }
function sub(a, b) { return V(a.x - b.x, a.y - b.y, a.z - b.z); }
function mul(a, k) { return V(a.x * k, a.y * k, a.z * k); }
function cross(a, b) { return V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x); }
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function norm(a) { const l = Math.hypot(a.x, a.y, a.z) || 1; return V(a.x / l, a.y / l, a.z / l); }
function rotX(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x, v.y * c - v.z * s, v.y * s + v.z * c); }
function rotY(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x * c + v.z * s, v.y, -v.x * s + v.z * c); }
function rotZ(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x * c - v.y * s, v.x * s + v.y * c, v.z); }
function xf(v, r) { return rotY(rotX(rotZ(v, r.z), r.x), r.y); }
function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function smooth(a, b, x) { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
function mix(c1, c2, t) { return [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t]; }
function C(r, g, b) { return [r * 255, g * 255, b * 255]; }
function lighten(c, k) { return mix(c, [255, 255, 255], k); }
function darken(c, k) { return mix(c, [0, 0, 0], k); }
function lcg(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ============ malha: {verts:[{p,n,c}], tris:[[a,b,c]]} ============ */

/* Catmull-Rom sobre seções {p, rx, ry} */
function resample(sections, per) {
  const out = [];
  const n = sections.length;
  const get = i => sections[Math.max(0, Math.min(n - 1, i))];
  const cr = (a, b, c, d, t) => b + 0.5 * t * (c - a + t * (2 * a - 5 * b + 4 * c - d + t * (3 * (b - c) + d - a)));
  for (let i = 0; i < n - 1; i++) {
    const s0 = get(i - 1), s1 = get(i), s2 = get(i + 1), s3 = get(i + 2);
    const steps = i === n - 2 ? per + 1 : per;
    for (let k = 0; k < steps; k++) {
      const t = k / per;
      out.push({
        p: V(cr(s0.p.x, s1.p.x, s2.p.x, s3.p.x, t), cr(s0.p.y, s1.p.y, s2.p.y, s3.p.y, t), cr(s0.p.z, s1.p.z, s2.p.z, s3.p.z, t)),
        rx: Math.max(0.004, cr(s0.rx, s1.rx, s2.rx, s3.rx, t)),
        ry: Math.max(0.004, cr(s0.ry ?? s0.rx, s1.ry ?? s1.rx, s2.ry ?? s2.rx, s3.ry ?? s3.rx, t)),
      });
    }
  }
  return out;
}

/* Loft: gera tubo suave fechado ao longo das seções.
   colorFn(u, sinT, cosT) -> [r,g,b]; u = 0..1 ao longo da espinha. */
function loft(sections, segs, colorFn, baseColor) {
  const S = resample(sections, 4);
  const verts = [], tris = [];
  const rows = [];
  for (let i = 0; i < S.length; i++) {
    const prev = S[Math.max(0, i - 1)].p, next = S[Math.min(S.length - 1, i + 1)].p;
    let t = norm(sub(next, prev));
    let up0 = Math.abs(t.y) > 0.9 ? V(0, 0, 1) : V(0, 1, 0);
    const right = norm(cross(up0, t));
    const upv = norm(cross(t, right));
    const u = i / (S.length - 1);
    const row = [];
    for (let j = 0; j < segs; j++) {
      const th = 2 * Math.PI * j / segs;
      const ct = Math.cos(th), st = Math.sin(th);
      const p = add(S[i].p, add(mul(right, ct * S[i].rx), mul(upv, st * S[i].ry)));
      const c = colorFn ? colorFn(u, st, ct) : baseColor;
      row.push(verts.push({ p, n: V(0, 0, 0), c }) - 1);
    }
    rows.push(row);
  }
  for (let i = 0; i < rows.length - 1; i++) {
    for (let j = 0; j < segs; j++) {
      const a = rows[i][j], b = rows[i + 1][j], c = rows[i + 1][(j + 1) % segs], d = rows[i][(j + 1) % segs];
      tris.push([a, b, d]); tris.push([b, c, d]);
    }
  }
  return { verts, tris };
}

/* esfera suave para detalhes (olhos, nariz) */
function ball(r, pos, color, scale, seg) {
  seg = seg || 10;
  scale = scale || V(1, 1, 1);
  const verts = [], tris = [], rows = [];
  const rings = Math.max(6, seg - 2);
  for (let i = 0; i <= rings; i++) {
    const ph = Math.PI * i / rings, row = [];
    for (let j = 0; j < seg; j++) {
      const th = 2 * Math.PI * j / seg;
      const p = V(r * Math.sin(ph) * Math.cos(th) * scale.x, r * Math.cos(ph) * scale.y, r * Math.sin(ph) * Math.sin(th) * scale.z);
      row.push(verts.push({ p: add(p, pos), n: V(0, 0, 0), c: color }) - 1);
    }
    rows.push(row);
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < seg; j++) {
    const a = rows[i][j], b = rows[i + 1][j], c = rows[i + 1][(j + 1) % seg], d = rows[i][(j + 1) % seg];
    if (i > 0) tris.push([a, b, d]);
    if (i < rings - 1) tris.push([b, c, d]);
  }
  return { verts, tris };
}

/* caixinha (bigodes, língua) — normais duras, ok para detalhes finos */
function slab(sx, sy, sz, pos, rot, color) {
  const x = sx / 2, y = sy / 2, z = sz / 2;
  const P = [V(-x,-y,-z),V(x,-y,-z),V(x,y,-z),V(-x,y,-z),V(-x,-y,z),V(x,-y,z),V(x,y,z),V(-x,y,z)];
  const F = [[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]];
  const verts = [], tris = [];
  for (const q of F) {
    const idx = q.map(k => {
      let p = P[k];
      if (rot) p = xf(p, rot);
      return verts.push({ p: add(p, pos), n: V(0, 0, 0), c: color }) - 1;
    });
    tris.push([idx[0], idx[1], idx[2]]); tris.push([idx[0], idx[2], idx[3]]);
  }
  return { verts, tris };
}

function computeNormals(mesh) {
  for (const t of mesh.tris) {
    const a = mesh.verts[t[0]].p, b = mesh.verts[t[1]].p, c = mesh.verts[t[2]].p;
    const n = cross(sub(b, a), sub(c, a));
    for (const i of t) { const vn = mesh.verts[i].n; vn.x += n.x; vn.y += n.y; vn.z += n.z; }
  }
  for (const v of mesh.verts) v.n = norm(v.n);
  return mesh;
}

/* ============ construção dos pets ============ */
/* Grupos animáveis: core (corpo), head, tail, legs[4], ball. As peças de
   cada grupo giram em torno da origem do grupo (espelha o pet_body.gd). */

function Group(origin) { return { origin, rot: V(0, 0, 0), off: V(0, 0, 0), meshes: [] }; }
function put(group, mesh, tag) { computeNormals(mesh); mesh.tag = tag || null; group.meshes.push(mesh); }

const PETS = {
  sirius: {
    name: 'Sirius', tag: 'Latido Potente — protetor e estabanado',
    scale: 1.15, defense: 'bark', cute: 'sit_wag', tongue: true,
    body: C(0.18, 0.17, 0.18), belly: C(0.28, 0.26, 0.27), grizzle: C(0.66, 0.64, 0.6),
    eye: C(0.5, 0.32, 0.17), eyeR: 0.05,
    build(g) {
      const B = this.body, BE = this.belly, GR = this.grizzle;
      // corpo contínuo: quadril -> peito -> pescoço
      const bodyFn = (u, st) => {
        let c = B;
        const bellyT = smooth(0.05, 0.6, -st) * smooth(0.05, 0.25, u) * (1 - smooth(0.72, 0.95, u));
        c = mix(c, BE, bellyT * 0.85);
        const ruffT = smooth(0.62, 0.85, u) * 0.35;      // peitoral levemente mais claro
        return mix(c, lighten(B, 0.16), ruffT);
      };
      put(g.core, loft([
        { p: V(0, 0.54, -0.46), rx: 0.05 },
        { p: V(0, 0.52, -0.34), rx: 0.20, ry: 0.19 },
        { p: V(0, 0.48, -0.08), rx: 0.235, ry: 0.225 },
        { p: V(0, 0.50, 0.14), rx: 0.215, ry: 0.21 },
        { p: V(0, 0.58, 0.30), rx: 0.15, ry: 0.15 },
        { p: V(0, 0.64, 0.38), rx: 0.05 },
      ], 16, bodyFn));
      // cabeça + focinho comprido com queixo grisalho
      const H = g.head.origin;
      const headFn = (u, st) => {
        let c = B;
        const griz = smooth(0.62, 0.8, u) * smooth(-0.1, -0.7, st) * 0.9 + smooth(0.86, 0.98, u) * 0.35;
        return mix(c, GR, Math.min(1, griz));
      };
      put(g.head, loft([
        { p: add(H, V(0, 0.02, -0.14)), rx: 0.05 },
        { p: add(H, V(0, 0.02, -0.05)), rx: 0.155, ry: 0.147 },
        { p: add(H, V(0, 0.01, 0.05)), rx: 0.145, ry: 0.137 },
        { p: add(H, V(0, -0.035, 0.15)), rx: 0.075, ry: 0.066 },
        { p: add(H, V(0, -0.05, 0.27)), rx: 0.05, ry: 0.046 },
        { p: add(H, V(0, -0.05, 0.32)), rx: 0.018 },
      ], 14, headFn));
      // orelhas caídas abertas para os lados (mais destacadas da cabeça)
      for (const s of [-1, 1]) {
        put(g.head, loft([
          { p: add(H, V(0.09 * s, 0.16, -0.01)), rx: 0.025 },
          { p: add(H, V(0.18 * s, 0.12, 0.0)), rx: 0.07, ry: 0.024 },
          { p: add(H, V(0.26 * s, 0.0, 0.01)), rx: 0.07, ry: 0.026 },
          { p: add(H, V(0.29 * s, -0.1, 0.02)), rx: 0.04, ry: 0.018 },
          { p: add(H, V(0.3 * s, -0.15, 0.02)), rx: 0.009 },
        ], 10, u => mix(lighten(B, 0.14), darken(B, 0.05), u)));
      }
      // pernas compridas com patinha
      legSet(g, [0.15, 0.20], 0.5, 0.07, darken(B, 0.1), lighten(B, 0.05));
      // PLUMA: rabo enorme enrolado sobre as costas (bem colado ao corpo)
      put(g.tail, loft([
        { p: V(0, 0.5, -0.4), rx: 0.045 },
        { p: V(0, 0.66, -0.5), rx: 0.09, ry: 0.085 },
        { p: V(0, 0.86, -0.47), rx: 0.115, ry: 0.105 },
        { p: V(0, 0.99, -0.32), rx: 0.09, ry: 0.085 },
        { p: V(0, 1.03, -0.18), rx: 0.045 },
        { p: V(0, 1.02, -0.12), rx: 0.008 },
      ], 12, u => mix(this.body, lighten(this.body, 0.22), u)));
      face(g, this, V(0.062, 0.045, 0.125), V(0, -0.04, 0.325), 0.032);
      tongueOf(g, this, add(H, V(0, -0.1, 0.26)), false);
    },
  },

  belatriz: {
    name: 'Belatriz', tag: 'Modo Feroz — pequena e valente',
    scale: 0.8, defense: 'ferocious', cute: 'belly_up', blep: true,
    body: C(0.85, 0.7, 0.48), belly: C(0.94, 0.88, 0.73), cream: C(0.93, 0.87, 0.7),
    eye: C(0.3, 0.19, 0.11), eyeR: 0.062,
    build(g) {
      const B = this.body, CRE = this.cream;
      const bodyFn = (u, st) => {
        let c = B;
        c = mix(c, this.belly, smooth(0.0, 0.55, -st) * 0.9);
        c = mix(c, CRE, smooth(0.6, 0.9, u) * 0.55);   // peito creme
        return c;
      };
      // corpinho compacto e redondo
      put(g.core, loft([
        { p: V(0, 0.34, -0.30), rx: 0.05 },
        { p: V(0, 0.33, -0.20), rx: 0.185, ry: 0.175 },
        { p: V(0, 0.31, 0.0), rx: 0.21, ry: 0.20 },
        { p: V(0, 0.33, 0.14), rx: 0.18, ry: 0.175 },
        { p: V(0, 0.40, 0.23), rx: 0.125, ry: 0.12 },
        { p: V(0, 0.45, 0.28), rx: 0.045 },
      ], 16, bodyFn));
      // cabeça grande redonda, focinho curtinho com barba creme
      const H = g.head.origin;
      const headFn = (u, st) => {
        let c = B;
        const beard = smooth(0.5, 0.75, u) * (smooth(-0.05, -0.6, st) * 0.9 + 0.25);
        c = mix(c, CRE, Math.min(1, beard));
        c = mix(c, lighten(B, 0.12), smooth(0.7, 0.4, u) * smooth(0.4, 0.9, st) * 0.5); // topete claro
        return c;
      };
      put(g.head, loft([
        { p: add(H, V(0, 0.01, -0.13)), rx: 0.05 },
        { p: add(H, V(0, 0.01, -0.04)), rx: 0.17, ry: 0.16 },
        { p: add(H, V(0, 0.0, 0.06)), rx: 0.16, ry: 0.15 },
        { p: add(H, V(0, -0.035, 0.13)), rx: 0.105, ry: 0.09 },
        { p: add(H, V(0, -0.04, 0.18)), rx: 0.06, ry: 0.05 },
        { p: add(H, V(0, -0.04, 0.2)), rx: 0.015 },
      ], 14, headFn));
      // orelhas caídas com franja (destacadas e um tom mais escuro)
      for (const s of [-1, 1]) {
        put(g.head, loft([
          { p: add(H, V(0.08 * s, 0.15, -0.01)), rx: 0.022 },
          { p: add(H, V(0.17 * s, 0.1, 0.0)), rx: 0.06, ry: 0.022 },
          { p: add(H, V(0.23 * s, -0.02, 0.01)), rx: 0.06, ry: 0.024 },
          { p: add(H, V(0.24 * s, -0.11, 0.02)), rx: 0.03, ry: 0.014 },
          { p: add(H, V(0.24 * s, -0.14, 0.02)), rx: 0.008 },
        ], 10, u => mix(darken(this.body, 0.12), this.cream, u * 0.4)));
      }
      legSet(g, [0.12, 0.14], 0.28, 0.058, darken(B, 0.08), this.cream);
      // rabinho fofo curvado (mais volumoso)
      put(g.tail, loft([
        { p: V(0, 0.36, -0.26), rx: 0.04 },
        { p: V(0, 0.48, -0.36), rx: 0.085, ry: 0.08 },
        { p: V(0, 0.6, -0.33), rx: 0.06, ry: 0.055 },
        { p: V(0, 0.66, -0.27), rx: 0.01 },
      ], 10, u => mix(this.body, this.cream, u * 0.7)));
      face(g, this, V(0.062, 0.035, 0.12), V(0, -0.025, 0.205), 0.03);
      tongueOf(g, this, add(H, V(0, -0.075, 0.17)), true);
    },
  },

  zoe: {
    name: 'Zoe', tag: 'Escalada Fantasma — bagunceira invisível',
    scale: 1.0, defense: 'hide', cute: 'play',
    body: C(0.17, 0.13, 0.11), orange: C(0.78, 0.45, 0.16), cream: C(0.85, 0.68, 0.42),
    eye: C(0.93, 0.68, 0.18), eyeR: 0.05,
    spots: null,
    build(g) {
      const B = this.body;
      // manchas escaminha semeadas no espaço (u, θ)
      const rng = lcg(20250705);
      const spots = [];
      for (let i = 0; i < 13; i++) {
        spots.push({ u: rng(), th: rng() * 2 * Math.PI, r: 0.12 + rng() * 0.16, c: i % 2 ? this.cream : this.orange });
      }
      const mottleFn = (u, st, ct) => {
        let c = B;
        const th = Math.atan2(st, ct);
        for (const s of spots) {
          let dth = Math.abs(th - s.th); dth = Math.min(dth, 2 * Math.PI - dth);
          const d = Math.hypot((u - s.u) * 1.6, dth / Math.PI);
          c = mix(c, s.c, smooth(s.r, s.r * 0.45, d) * 0.9);
        }
        return c;
      };
      // corpo BEM redondinho
      put(g.core, loft([
        { p: V(0, 0.36, -0.36), rx: 0.06 },
        { p: V(0, 0.34, -0.24), rx: 0.235, ry: 0.215 },
        { p: V(0, 0.33, 0.0), rx: 0.275, ry: 0.255 },
        { p: V(0, 0.35, 0.16), rx: 0.215, ry: 0.205 },
        { p: V(0, 0.42, 0.26), rx: 0.125, ry: 0.12 },
        { p: V(0, 0.46, 0.31), rx: 0.05 },
      ], 18, mottleFn));
      // cabeça de gata com manchas + focinho creme
      const H = g.head.origin;
      const headFn = (u, st, ct) => {
        let c = mottleFn(u * 0.6 + 0.2, st, ct);
        return mix(c, this.cream, smooth(0.62, 0.85, u) * 0.85);
      };
      put(g.head, loft([
        { p: add(H, V(0, 0.01, -0.12)), rx: 0.045 },
        { p: add(H, V(0, 0.01, -0.04)), rx: 0.15, ry: 0.14 },
        { p: add(H, V(0, 0.0, 0.05)), rx: 0.14, ry: 0.13 },
        { p: add(H, V(0, -0.025, 0.12)), rx: 0.075, ry: 0.062 },
        { p: add(H, V(0, -0.025, 0.155)), rx: 0.02 },
      ], 14, headFn));
      catEars(g, this.body, 1.0, this.orange);
      legSet(g, [0.13, 0.16], 0.3, 0.062, darken(B, 0.05), this.orange);
      // rabo fino com pontinha clara (curva suave desde a base)
      put(g.tail, loft([
        { p: V(0, 0.34, -0.28), rx: 0.045 },
        { p: V(0, 0.44, -0.38), rx: 0.038 },
        { p: V(0, 0.58, -0.46), rx: 0.033 },
        { p: V(0, 0.76, -0.49), rx: 0.028 },
        { p: V(0, 0.9, -0.44), rx: 0.022 },
        { p: V(0, 0.97, -0.4), rx: 0.006 },
      ], 9, u => u > 0.82 ? C(0.88, 0.85, 0.78) : mix(this.body, this.orange, (Math.sin(u * 18) > 0.4 ? 0.55 : 0))));
      face(g, this, V(0.055, 0.03, 0.105), V(0, -0.02, 0.16), 0.026);
    },
  },

  minerva: {
    name: 'Minerva', tag: 'Patada Potente — rápida e implacável',
    scale: 1.0, defense: 'pounce', cute: 'rub',
    body: C(0.11, 0.11, 0.13), sheen: C(0.26, 0.26, 0.31),
    eye: C(0.8, 0.8, 0.32), eyeR: 0.044, whiskers: true, fangs: true,
    build(g) {
      const B = this.body;
      const bodyFn = (u, st) => mix(B, this.sheen, smooth(0.3, 1, st) * 0.5); // brilho no dorso
      // corpo esguio de pantera
      put(g.core, loft([
        { p: V(0, 0.44, -0.36), rx: 0.05 },
        { p: V(0, 0.42, -0.26), rx: 0.165, ry: 0.155 },
        { p: V(0, 0.41, 0.0), rx: 0.185, ry: 0.175 },
        { p: V(0, 0.43, 0.15), rx: 0.155, ry: 0.15 },
        { p: V(0, 0.52, 0.26), rx: 0.105, ry: 0.1 },
        { p: V(0, 0.57, 0.31), rx: 0.045 },
      ], 16, bodyFn));
      const H = g.head.origin;
      put(g.head, loft([
        { p: add(H, V(0, 0.01, -0.12)), rx: 0.045 },
        { p: add(H, V(0, 0.01, -0.04)), rx: 0.14, ry: 0.135 },
        { p: add(H, V(0, 0.0, 0.05)), rx: 0.13, ry: 0.12 },
        { p: add(H, V(0, -0.025, 0.12)), rx: 0.07, ry: 0.058 },
        { p: add(H, V(0, -0.025, 0.15)), rx: 0.018 },
      ], 14, (u, st) => mix(B, this.sheen, smooth(0.3, 1, st) * 0.4)));
      catEars(g, this.body, 1.3, darken(this.body, 0.2));
      legSet(g, [0.12, 0.15], 0.38, 0.05, B, this.sheen);
      // rabo longo elegante
      put(g.tail, loft([
        { p: V(0, 0.44, -0.34), rx: 0.038 },
        { p: V(0, 0.66, -0.46), rx: 0.03 },
        { p: V(0, 0.9, -0.46), rx: 0.025 },
        { p: V(0, 1.05, -0.36), rx: 0.018 },
        { p: V(0, 1.1, -0.3), rx: 0.005 },
      ], 9, null, this.body));
      face(g, this, V(0.046, 0.032, 0.108), V(0, -0.018, 0.155), 0.026);
      // bigodes brancos + presinhas
      for (const s of [-1, 1]) {
        for (let i = 0; i < 2; i++) {
          put(g.head, slab(0.16, 0.006, 0.006, add(H, V(0.13 * s, -0.03 - 0.03 * i, 0.11)), V(0, 0.4 * s, 0.1 * s * (i ? -0.5 : 1)), C(0.93, 0.93, 0.9)));
        }
        put(g.head, loft([
          { p: add(H, V(0.028 * s, -0.075, 0.135)), rx: 0.011 },
          { p: add(H, V(0.028 * s, -0.11, 0.14)), rx: 0.003 },
        ], 6, null, C(0.95, 0.94, 0.9)));
      }
    },
  },
};

/* pernas: pares dianteiro/traseiro com patinha arredondada */
function legSet(g, xz, hipY, r, color, pawTone) {
  for (let i = 0; i < 4; i++) {
    const lx = (i % 2 === 0 ? -1 : 1) * xz[0];
    const lz = (i < 2 ? 1 : -1) * xz[1];
    const leg = g.legs[i];
    leg.origin = V(lx, hipY, lz);
    put(leg, loft([
      { p: V(lx, hipY + 0.06, lz), rx: r * 1.25 },
      { p: V(lx, hipY - (hipY - 0.1) * 0.5, lz), rx: r },
      { p: V(lx, 0.09, lz), rx: r * 0.92 },
      { p: V(lx, 0.045, lz + 0.025), rx: r * 1.15, ry: r * 0.8 },
      { p: V(lx, 0.01, lz + 0.03), rx: r * 0.5 },
    ], 10, u => mix(color, pawTone, smooth(0.75, 0.95, u) * 0.4)));
  }
}

/* orelhas de gato: triângulos suaves achatados */
function catEars(g, color, scaleK, innerColor) {
  const H = g.head.origin;
  for (const s of [-1, 1]) {
    put(g.head, loft([
      { p: add(H, V(0.075 * s, 0.1, -0.01)), rx: 0.055 * scaleK, ry: 0.02 },
      { p: add(H, V(0.1 * s, 0.17 * scaleK, -0.015)), rx: 0.035 * scaleK, ry: 0.015 },
      { p: add(H, V(0.115 * s, 0.23 * scaleK, -0.02)), rx: 0.006 },
    ], 8, u => mix(color, innerColor, (1 - u) * 0.25)));
  }
}

/* olhos com íris grande (nada de esbugalhado) + nariz */
function face(g, pet, eyeAt, noseAt, noseR) {
  const H = g.head.origin;
  for (const s of [-1, 1]) {
    const e = add(H, V(eyeAt.x * s, eyeAt.y, eyeAt.z));
    const out = norm(V(0.3 * s, 0.12, 0.95));       // direção do olhar (levemente para fora)
    const at = k2 => add(e, mul(out, pet.eyeR * k2));
    put(g.head, ball(pet.eyeR, e, C(0.93, 0.91, 0.88), V(1, 1, 0.5), 10));
    put(g.head, ball(pet.eyeR * 0.88, at(0.22), pet.eye, V(1, 1, 0.5), 10));
    put(g.head, ball(pet.eyeR * 0.5, at(0.45), C(0.05, 0.05, 0.05), V(1, 1, 0.5), 8));
    put(g.head, ball(pet.eyeR * 0.16, add(at(0.6), V(pet.eyeR * 0.18 * s, pet.eyeR * 0.22, 0)), [255, 255, 255], V(1, 1, 1), 6));
  }
  put(g.head, ball(noseR, add(H, noseAt), C(0.06, 0.05, 0.05), V(1.3, 0.85, 0.9), 8));
}

function tongueOf(g, pet, at, always) {
  const m = loft([
    { p: at, rx: 0.028, ry: 0.01 },
    { p: add(at, V(0, -0.035, 0.02)), rx: 0.026, ry: 0.009 },
    { p: add(at, V(0, -0.055, 0.022)), rx: 0.012, ry: 0.006 },
  ], 8, null, C(0.93, 0.5, 0.55));
  put(g.head, m, always ? null : 'tongue');
}

function buildPet(id) {
  const def = PETS[id];
  const g = {
    core: Group(V(0, 0, 0)),
    head: Group(def.headOrigin || headOriginFor(id)),
    tail: Group(V(0, def.scale >= 1 ? 0.5 : 0.36, -0.34)),
    legs: [Group(V(0, 0, 0)), Group(V(0, 0, 0)), Group(V(0, 0, 0)), Group(V(0, 0, 0))],
    ballGroup: Group(V(0, 0, 0)),
  };
  def.build(g);
  // bolinha da pose "play"
  put(g.ballGroup, ball(0.09, V(0, 0.09, 0.55), C(0.9, 0.25, 0.3), V(1, 1, 1), 10));
  put(g.ballGroup, slab(0.26, 0.024, 0.05, V(0, 0.09, 0.55), null, C(0.95, 0.9, 0.85)));
  return { id, def, g, pose: 'idle', alpha: 1 };
}
function headOriginFor(id) {
  return { sirius: V(0, 0.72, 0.42), belatriz: V(0, 0.53, 0.3), zoe: V(0, 0.55, 0.34), minerva: V(0, 0.66, 0.34) }[id];
}

/* ============ poses ============ */
function applyPose(pet, t) {
  const g = pet.g;
  const cr = V(0, 0, 0), cp = V(0, 0, 0);
  let wag = 3, headRx = 0, legSwing = null, showBall = false, alpha = 1, bounce = 0;
  switch (pet.pose) {
    case 'walk': { const s = Math.sin(t * 10) * 0.55; legSwing = i => s * (i % 2 ? -1 : 1); cp.y = Math.abs(Math.sin(t * 10)) * 0.04; wag = 6; break; }
    case 'idle': cp.y = Math.sin(t * 2) * 0.013; break;
    case 'bark': cr.x = -0.22; headRx = Math.sin(t * 20) * 0.18; wag = 10; break;
    case 'ferocious': cr.x = 0.18; cp.y = Math.abs(Math.sin(t * 14)) * 0.05; wag = 14; break;
    case 'pounce': cr.x = 0.32; wag = 8; break;
    case 'hide': cp.y = -0.1; cr.x = 0.08; alpha = 0.35; break;
    case 'sit_wag': cr.x = -0.45; cp.y = -0.04; wag = 16; break;
    case 'belly_up': cr.z = Math.PI; cp.y = 0.86; legSwing = i => Math.sin(t * 6 + i) * 0.3; break;
    case 'play': cr.x = 0.26; cp.y = Math.abs(Math.sin(t * 8)) * 0.07; wag = 12; showBall = true; bounce = Math.abs(Math.sin(t * 8 + 1)) * 0.24; break;
    case 'rub': cr.z = Math.sin(t * 5) * 0.32; wag = 10; break;
  }
  g.core.rot = cr; g.core.off = cp;
  g.head.rot = V(headRx, 0, 0);
  g.tail.rot = V(0, Math.sin(t * wag) * 0.55, 0);
  g.legs.forEach((l, i) => { l.rot = V(legSwing ? legSwing(i) : 0, 0, 0); });
  pet.showBall = showBall; pet.bounce = bounce; pet.alpha = alpha;
  pet.tongueOut = !!pet.def.tongue && (pet.pose === 'walk' || pet.pose === 'sit_wag' || pet.pose === 'play');
}

/* ============ render ============ */
const KEY = norm(V(-0.45, 0.9, 0.6));
const FILL = norm(V(0.6, 0.25, -0.4));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeViewer(canvas, pet) {
  const ctx = canvas.getContext('2d');
  let yaw = 0.55, pitch = 0.2, dragging = false, lx = 0, ly = 0, spin = !REDUCED;

  const stage = canvas.parentElement;
  stage.addEventListener('pointerdown', e => { dragging = true; spin = false; lx = e.clientX; ly = e.clientY; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw += (e.clientX - lx) * 0.011;
    pitch = Math.max(-0.15, Math.min(0.75, pitch + (e.clientY - ly) * 0.008));
    lx = e.clientX; ly = e.clientY;
  });
  stage.addEventListener('pointerup', () => { dragging = false; });
  stage.addEventListener('pointercancel', () => { dragging = false; });

  function drawGroup(group, out, k, opts) {
    const o = group.origin, core = pet.g.core;
    for (const mesh of group.meshes) {
      if (mesh.tag === 'tongue' && !pet.tongueOut) continue;
      // transforma vértices e normais
      const tv = mesh.verts.map(v => {
        let p = xf(sub(v.p, o), group.rot);
        p = add(add(p, o), group.off);
        let n = xf(v.n, group.rot);
        if (group !== core && (!opts || !opts.skipCore)) {
          p = add(xf(p, core.rot), core.off);
          n = xf(n, core.rot);
        }
        if (opts && opts.extra) p = add(p, opts.extra);
        p = mul(p, k);
        p = rotX(rotY(p, yaw), pitch);
        n = rotX(rotY(n, yaw), pitch);
        return { p, n, c: v.c };
      });
      for (const t of mesh.tris) out.push([tv[t[0]], tv[t[1]], tv[t[2]]]);
    }
  }

  function frame(ms) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (canvas.width !== cw * dpr) { canvas.width = cw * dpr; canvas.height = ch * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (spin) yaw += 0.0035;
    applyPose(pet, ms / 1000);

    // sombra
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--shadow');
    ctx.beginPath();
    ctx.ellipse(cw / 2, ch * 0.87, 64 * pet.def.scale, 13 * pet.def.scale, 0, 0, Math.PI * 2);
    ctx.fill();

    const tris = [];
    const k = pet.def.scale;
    for (const grp of [pet.g.core, pet.g.head, pet.g.tail, ...pet.g.legs]) drawGroup(grp, tris, k);
    if (pet.showBall) drawGroup(pet.g.ballGroup, tris, k, { skipCore: true, extra: V(0, pet.bounce, 0) });

    // projeção
    const S = Math.min(cw, ch * 1.45);
    const camY = 0.6 * k, camZ = 3.1, f = 1.08;
    const drawn = [];
    for (const tv of tris) {
      const pv = tv.map(v => {
        const z = camZ - v.p.z;
        return { x: cw / 2 + (v.p.x * f / z) * S, y: ch * 0.87 - ((v.p.y - camY) * f / z + camY * f / camZ) * S, z };
      });
      // shading suave: intensidade por vértice (key + fill + ambiente)
      let it = 0, cr2 = 0, cg = 0, cb = 0;
      for (const v of tv) {
        let n = v.n;
        if (n.z < 0) n = V(-n.x, -n.y, -n.z);
        it += 0.44 + 0.48 * Math.max(0, dot(n, KEY)) + 0.18 * Math.max(0, dot(n, FILL));
        cr2 += v.c[0]; cg += v.c[1]; cb += v.c[2];
      }
      it /= 3; cr2 /= 3; cg /= 3; cb /= 3;
      drawn.push({ pv, depth: (pv[0].z + pv[1].z + pv[2].z) / 3, col: `rgb(${Math.min(255, cr2 * it) | 0},${Math.min(255, cg * it) | 0},${Math.min(255, cb * it) | 0})` });
    }
    drawn.sort((a, b) => b.depth - a.depth);
    ctx.globalAlpha = pet.alpha;
    for (const t of drawn) {
      ctx.fillStyle = t.col; ctx.strokeStyle = t.col; ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(t.pv[0].x, t.pv[0].y); ctx.lineTo(t.pv[1].x, t.pv[1].y); ctx.lineTo(t.pv[2].x, t.pv[2].y);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ============ página ============ */
const POSE_LABELS = { idle: 'Parado', walk: 'Andar', defense: 'Defesa', cute: 'Fofura' };
const grid = document.getElementById('grid');
for (const id of ['sirius', 'belatriz', 'zoe', 'minerva']) {
  const pet = buildPet(id);
  const def = pet.def;
  const card = document.createElement('div');
  card.className = 'card';
  const sw = `rgb(${def.body[0] | 0},${def.body[1] | 0},${def.body[2] | 0})`;
  card.innerHTML = `
    <div class="plate">
      <span class="swatch" style="background:${sw}"></span>
      <span class="pet-name">${def.name}</span>
      <span class="tagline">${def.tag}</span>
    </div>
    <div class="stage"><canvas aria-label="Modelo 3D de ${def.name}"></canvas><span class="hint">arraste p/ girar</span></div>
    <div class="poses" role="group" aria-label="Poses de ${def.name}"></div>
  `;
  grid.appendChild(card);
  const posesEl = card.querySelector('.poses');
  const buttons = {};
  for (const key of ['idle', 'walk', 'defense', 'cute']) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = POSE_LABELS[key];
    b.setAttribute('aria-pressed', key === 'idle' ? 'true' : 'false');
    b.addEventListener('click', () => {
      pet.pose = key === 'defense' ? def.defense : key === 'cute' ? def.cute : key;
      for (const kk in buttons) buttons[kk].setAttribute('aria-pressed', kk === key ? 'true' : 'false');
    });
    buttons[key] = b;
    posesEl.appendChild(b);
  }
  makeViewer(card.querySelector('canvas'), pet);
}
</script>
